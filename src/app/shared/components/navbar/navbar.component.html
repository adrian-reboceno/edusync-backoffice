<nav class="navbar-wrapper">
  <!-- Brand -->
  <div class="navbar-brand">
    <div class="brand-icon">
      <mat-icon>dashboard</mat-icon>
    </div>
    <span class="brand-name">EduSync</span>
  </div>

  <!-- Horizontal Menu -->
  <div class="navbar-menu-container">
    <ul class="navbar-menu" role="menubar">
      <!-- DASHBOARD ITEM (sin dropdown) -->
      <li class="menu-item-wrapper">
        <a routerLink="/dashboard"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           class="menu-item"
           (click)="closeMenus()">
          <mat-icon class="menu-icon">dashboard</mat-icon>
          <span class="menu-label">Dashboard</span>
        </a>
      </li>

      <!-- ANALYTICS USUARIOS ITEM (con dropdown) -->
      <li class="menu-item-wrapper">
        <button class="menu-item menu-dropdown"
                [class.open]="isAnalyticsOpen"
               (click)="toggleAnalyticsMenu()"
                type="button">
          <mat-icon class="menu-icon">analytics</mat-icon>
          <span class="menu-label">Analytics Usuarios</span>
          <mat-icon class="dropdown-arrow">expand_more</mat-icon>
        </button>

        <!-- Dropdown submenu - USAR [hidden] EN LUGAR DE *ngIf -->
        <div class="dropdown-submenu" [hidden]="!isAnalyticsOpen">
          <a routerLink="/analytics/usuarios/resumen"
             routerLinkActive="active"
             class="submenu-item"
             (click)="closeMenus()">
            <mat-icon class="submenu-icon">summarize</mat-icon>
            <span class="submenu-label">Resumen General</span>
          </a>
          <a routerLink="/analytics/usuarios/lista"
             routerLinkActive="active"
             class="submenu-item"
             (click)="closeMenus()">
            <mat-icon class="submenu-icon">people</mat-icon>
            <span class="submenu-label">Lista de Usuarios</span>
          </a>
        </div>
      </li>
    </ul>
  </div>

  <!-- Spacer -->
  <div class="navbar-spacer"></div>

  <!-- Right Actions -->
  <div class="navbar-actions">
    <!-- Notifications -->
    <button class="icon-btn notifications-btn"
            type="button"
            title="Notificaciones">
      <mat-icon class="notification-icon">notifications</mat-icon>
      <span class="notification-badge">3</span>
    </button>

    <!-- Divider -->
    <div class="navbar-divider"></div>

    <!-- User Profile Pill -->
    <div class="user-profile-wrapper">
      <button class="user-pill"
              (click)="toggleUserMenu()"
              type="button">
        <div class="user-avatar">{{ userInitials }}</div>
        <div class="user-info">
          <p class="user-name">{{ userName }}</p>
          <p class="user-role">{{ userRole }}</p>
        </div>
        <mat-icon class="user-chevron" [class.open]="showUserMenu">expand_more</mat-icon>
      </button>

      <!-- User Dropdown Menu -->
      <div class="user-dropdown" [hidden]="!showUserMenu">
        <div class="dropdown-header">
          <div class="dropdown-avatar">{{ userInitials }}</div>
          <div class="dropdown-info">
            <p class="dropdown-name">{{ userName }}</p>
            <p class="dropdown-email">{{ userEmail }}</p>
          </div>
        </div>

        <div class="dropdown-divider"></div>

        <a href="#" class="dropdown-item" (click)="$event.preventDefault()">
          <mat-icon class="item-icon">settings</mat-icon>
          <span class="item-label">Configuración</span>
        </a>
        <a href="#" class="dropdown-item" (click)="$event.preventDefault()">
          <mat-icon class="item-icon">person</mat-icon>
          <span class="item-label">Mi Perfil</span>
        </a>

        <div class="dropdown-divider"></div>

        <button class="dropdown-item logout-btn"
                (click)="logout()"
                type="button">
          <mat-icon class="item-icon">logout</mat-icon>
          <span class="item-label">Cerrar Sesión</span>
        </button>
      </div>
    </div>
  </div>
</nav>
