<nav class="navbar">
  <ul class="nav-menu">
    <!-- ===== DASHBOARD ===== -->
    <li class="nav-menu-item">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        <span class="nav-icon">📊</span>
        Dashboard
      </a>
    </li>

    <!-- ===== ANALYTICS - USUARIOS ===== -->
    <li class="nav-menu-item dropdown">
      <a href="#" class="nav-link" (click)="toggleAnalyticsMenu($event)">
        <span class="nav-icon">📈</span>
        Analytics Usuarios
        <span class="dropdown-arrow" [class.open]="showAnalyticsMenu">▼</span>
      </a>
      <div class="dropdown-menu" *ngIf="showAnalyticsMenu">
        <div class="dropdown-section">
          <a routerLink="/analytics/usuarios/resumen" 
             routerLinkActive="active"
             (click)="closeMenus()"
             class="dropdown-item">
            <span class="item-icon">📋</span> Resumen general
          </a>
          <a routerLink="/analytics/usuarios/lista" 
             routerLinkActive="active"
             (click)="closeMenus()"
             class="dropdown-item">
            <span class="item-icon">📑</span> Lista de usuarios
          </a>
        </div>
      </div>
    </li>
  </ul>

  <div class="navbar-right">
    <!-- Notifications -->
    <button class="notification-btn" (click)="toggleNotifications()">
      <span class="bell-icon">🔔</span>
      <span class="notification-badge" *ngIf="notificationCount > 0">{{ notificationCount }}</span>
    </button>

    <!-- Notifications Dropdown -->
    <div class="notifications-dropdown" *ngIf="showNotifications">
      <div class="notifications-header">
        <h3>Notificaciones</h3>
        <button class="clear-btn" (click)="clearAllNotifications()">Limpiar</button>
      </div>
      <div class="notifications-list">
        <div *ngIf="notifications.length === 0" class="no-notifications">
          No hay notificaciones
        </div>
        <div *ngFor="let notif of notifications" class="notification-item" [class]="notif.type">
          <p>{{ notif.message }}</p>
          <button class="view-btn" (click)="viewNotification(notif)">Ver</button>
        </div>
      </div>
    </div>

    <!-- User Profile -->
    <div class="user-profile" (click)="toggleUserMenu()">
      <div class="user-avatar">{{ user?.first_name?.charAt(0) }}</div>
      <div class="user-info">
        <p class="user-name">{{ user?.first_name }} {{ user?.last_name }}</p>
        <p class="user-role">Administrador</p>
      </div>
      <span class="dropdown-icon">▼</span>

      <div class="user-dropdown" *ngIf="showUserMenu">
        <a href="#" class="dropdown-item">Mi Perfil</a>
        <a href="#" class="dropdown-item">Configuración</a>
        <hr>
        <a href="#" class="dropdown-item logout" (click)="logout()">Cerrar sesión</a>
      </div>
    </div>
  </div>
</nav>
