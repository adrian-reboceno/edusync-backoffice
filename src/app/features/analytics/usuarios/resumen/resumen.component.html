<div class="resumen-container">
  <div class="page-header">
    <h1>Resumen General de Usuarios</h1>
    <p>Estadísticas y análisis de usuarios del sistema</p>
  </div>

  <div class="stats-grid">
    <div *ngFor="let stat of stats" class="stat-card" [style.borderLeftColor]="stat.color">
      <div class="stat-icon">{{ stat.icon }}</div>
      <div class="stat-content">
        <p class="stat-title">{{ stat.title }}</p>
        <p class="stat-value">{{ stat.value }}</p>
      </div>
    </div>
  </div>

  <div class="content-section">
    <h2>Información</h2>
    <p>Contenido del resumen de usuarios</p>
  </div>
</div>
