<div class="usuarios-lista-wrapper">
  <!-- Header -->
  <div class="lista-header">
    <h2>Lista de Usuarios</h2>
    <p class="subtitle">Gestiona y visualiza todos los usuarios del sistema</p>
  </div>

  <!-- Acciones -->
  <div class="lista-actions">
    <button class="btn btn-primary" [disabled]="selectedRows().length === 0" (click)="exportSelected()">
      <mat-icon>download</mat-icon>
      Exportar {{ selectedRows().length > 0 ? `(${selectedRows().length})` : '' }}
    </button>
  </div>

  <!-- Error -->
  @if (error()) {
    <div class="lista-error">
      <mat-icon>error_outline</mat-icon>
      <span>{{ error() }}</span>
    </div>
  }

  <!-- Data Table -->
  <app-data-table
    [columns]="columns"
    [rows]="rows()"
    [total]="total()"
    [loading]="loading()"
    [hasActions]="true"
    trackByKey="neo_id"
    (pageChange)="onPageChange($event)"
    (selectionChange)="onSelectionChange($event)">

    <!-- Plantilla de acciones -->
    <ng-template #actionsTemplate let-row="$implicit">
      <div class="actions-cell">
        <button (click)="view(row)" 
              type="button"
              class="action-btn"
              title="Ver detalles">
          <mat-icon>visibility</mat-icon>
        </button>
        <button class="action-btn edit" title="Editar" (click)="edit(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button class="action-btn delete" title="Eliminar" (click)="delete(row)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </ng-template>

  </app-data-table>
</div>
